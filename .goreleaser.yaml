# Builds and releases fixwire-cli for every platform it ships on (GoReleaser
# v2). A release starts from a v<version> tag; the GitHub release with its
# notes may exist already, and the binaries join it.
version: 2

project_name: fixwire-cli

builds:
  - id: fixwire-cli
    main: .
    binary: fixwire-cli
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Reproducible: the same commit gives the same binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, CHANGELOG.md]

checksum:
  name_template: checksums.txt

# The notes are the version's CHANGELOG.md section, on the release already.
changelog:
  disable: true

release:
  mode: keep-existing
