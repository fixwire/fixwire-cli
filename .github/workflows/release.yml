name: Release

# A v<version> tag (pushed with its GitHub release and notes) builds the
# binaries for every platform, adds them to the release with their checksums,
# and publishes the npm packages. Publishing waits for the PUBLISH variable.
# npm trusts a repository as a package's publisher only once the package
# exists, so the first publish takes an NPM_TOKEN secret; after that,
# trusted publishing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release's files
  id-token: write # npm's trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: the tag is on main and is the newest version in CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          newest=$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
          [ "$newest" = "$version" ] || { echo "::error::CHANGELOG.md's newest version is $newest, the tag says $version"; exit 1; }
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # npm's trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: npm packages
        run: node npm/pack.mjs "${GITHUB_REF_NAME}" dist npm/dist
      # Platform packages go first, so @fixwire/cli never names a missing one.
      - name: publish to npm
        if: vars.PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: for dir in npm/dist/cli-*/ npm/dist/cli/; do npm publish --provenance --access public "$dir"; done
